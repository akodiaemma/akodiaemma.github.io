<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Crossgates staging QA viewport</title><style>body{margin:0;background:#e9ede5;color:#123c30;font:15px Arial}header{padding:16px;display:flex;gap:18px;align-items:center;flex-wrap:wrap}select{font:inherit;padding:8px}#stage{margin:0 auto;position:relative;overflow:hidden;width:100%}iframe{border:0;display:block;background:white;transform-origin:top left}p{margin:0}label{display:flex;align-items:center;gap:8px}</style></head><body><header><strong>Staging visual QA</strong><label>Page<select id="page"><option>index.html</option><option>suppliers.html</option><option>buyers.html</option><option>partners.html</option><option>passports.html</option><option>stiv.html</option><option>contact.html</option><option>about.html</option><option>impact.html</option><option>fr/index.html</option><option>de/index.html</option><option>sw/index.html</option><option>lg/index.html</option></select></label><label>Viewport width<select id="width"><option>360</option><option>390</option><option>430</option><option>768</option><option>1024</option><option selected>1440</option><option>1920</option></select></label><p id="status">Loading…</p></header><div id="stage"><iframe title="Rendered website at the selected viewport width" id="preview"></iframe></div><script>
const frame=document.getElementById('preview'),stage=document.getElementById('stage'),page=document.getElementById('page'),width=document.getElementById('width'),status=document.getElementById('status');
function size(){const w=Number(width.value),scale=Math.min(1,(innerWidth-24)/w);frame.style.width=w+'px';frame.style.height='900px';frame.style.transform='scale('+scale+')';frame.style.marginLeft=Math.max(0,(innerWidth-w*scale)/2)+'px';stage.style.height=(900*scale)+'px';}
function load(){frame.removeAttribute('data-ready');size();frame.src=page.value+(page.value.includes('?')?'&':'?')+'lang='+((page.value.split('/').length>1)?page.value.split('/')[0]:'en')+'&qa=1';status.textContent='Rendering '+width.value+' × 900…';}
frame.onload=()=>{frame.dataset.ready='true';status.textContent='Rendered '+width.value+' × 900 (display scaled to fit this QA page)';};page.onchange=load;width.onchange=load;addEventListener('resize',size);load();
</script></body></html>
